# Overlay: optional Ollama sibling as a local model host for OpenCode.
# Default `docker compose up` is unchanged — use this file only when enabling Ollama.
#
# CPU / no NVIDIA toolkit (this overlay alone):
#   docker compose -f docker-compose.yaml -f docker-compose.ollama.yaml up -d --force-recreate
#
# NVIDIA GPU (host must have drivers + NVIDIA Container Toolkit):
#   docker compose -f docker-compose.yaml -f docker-compose.ollama.yaml -f docker-compose.ollama.gpu.yaml up -d --force-recreate
#
# Sandbox + GPU (start sandbox-dind first; all -f files in one project):
#   docker compose -f docker-compose.yaml -f docker-compose.sandbox.yaml -f docker-compose.ollama.yaml -f docker-compose.ollama.gpu.yaml up -d --force-recreate
#
# See docs/ollama.md.

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.32.14}
    container_name: ollama
    restart: unless-stopped
    environment:
      # Listen on all interfaces inside the container so code-box can reach
      # http://ollama:11434 (the image default of 127.0.0.1 would not).
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_ORIGINS: "*"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    networks:
      default: {}
      ollama-net:
        ipv4_address: 172.30.114.10
        aliases: [ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-8G}

  # OpenCode discovers Ollama at 127.0.0.1:11434. Bind loopback only so nested
  # DinD on sandbox-net cannot reach the API via code-box's sandbox IP.
  ollama-localhost-proxy:
    image: alpine/socat
    container_name: ollama-localhost-proxy
    restart: unless-stopped
    network_mode: "service:code-box"
    # Static IP — sidecar shares code-box's netns, not its /etc/hosts or resolv.conf.
    command: ["TCP-LISTEN:11434,bind=127.0.0.1,fork,reuseaddr", "TCP:172.30.114.10:11434"]
    depends_on:
      ollama:
        condition: service_healthy
      code-box:
        condition: service_started

  code-box:
    environment:
      # Client URL for OpenCode and other tools inside the desktop.
      # (Distinct from OLLAMA_HOST on the ollama service, which is the listen address.)
      OLLAMA_HOST: http://ollama:11434
    extra_hosts:
      - "ollama:172.30.114.10"
    networks:
      default: {}
      ollama-net: {}
    depends_on:
      ollama:
        condition: service_healthy

networks:
  ollama-net:
    ipam:
      config:
        - subnet: 172.30.114.0/24

volumes:
  ollama:
