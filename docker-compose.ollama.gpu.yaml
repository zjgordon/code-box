# Overlay: pass NVIDIA GPUs into the Ollama sibling.
# Requires docker-compose.ollama.yaml plus host NVIDIA drivers and Container Toolkit.
# Default `docker compose up` is unchanged — do not use this file on hosts without nvidia.
#
#   docker compose -f docker-compose.yaml -f docker-compose.ollama.yaml -f docker-compose.ollama.gpu.yaml up -d
#
# See docs/ollama.md.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
